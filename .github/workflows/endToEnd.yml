name: End-to-End CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. Equivalent to Jenkins 'Checkout' stage
  checkout_code:
    name: Checkout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

  # 2. Equivalent to Jenkins 'Build' stage
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: checkout_code
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Node Modules
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: dist/

  # 3. Equivalent to Jenkins 'Test' stage
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test:unit

  # 4. Equivalent to Jenkins 'Deploy' stage
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    environment: Production
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: dist/

      - name: Deploy to Cloud
        run: |
          echo "Deploying to production server..."
          # Replace with your actual deployment script or Action
          # e.g., aws s3 sync dist/ s3://my-bucket
